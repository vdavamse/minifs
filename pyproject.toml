[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "minifs"
dynamic = ["version"]  # from crates/minifs-regex/Cargo.toml
description = "Postgres based VFS for agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "vdavamse" }]
keywords = ["vfs", "filesystem", "postgres", "postgresql", "agents", "llm", "pydantic-ai", "lakebase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    "psycopg>=3.3",  # watch relies on notifies(timeout=) keeping notifications that arrive between calls
    "psycopg-pool>=3.3",  # callable connection kwargs: a fresh credential per connection
]

[project.urls]
Homepage = "https://github.com/vdavamse/minifs"
Repository = "https://github.com/vdavamse/minifs"
Issues = "https://github.com/vdavamse/minifs/issues"

[project.optional-dependencies]
# Bundled libpq; without it psycopg needs a system libpq.
binary = ["psycopg[binary]>=3.3"]
# The agent tools (minifs.tools). minifs.vfs and minifs.db work without it.
pydantic-ai = ["pydantic-ai-slim>=2.51"]

[project.scripts]
minifs = "minifs.cli:main"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.3",
    "pydantic-ai-slim>=2.61",  # tests/tools reads retries as ToolReturnPart(outcome="retried")
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers>=4.9",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "maturin>=1.9,<2",
    "packaging>=24",  # tests/test_regex_extension.py compares versions
]

[tool.maturin]
manifest-path = "crates/minifs-regex/Cargo.toml"
module-name = "minifs._regex"
python-packages = ["minifs"]
include = [{ path = "minifs/db/migrations/*.sql", format = ["sdist", "wheel"] }]

[tool.uv]
# The development build (uv sync) enables the regex oracle. uv applies this only to builds it runs in this
# checkout: not maturin-action's release wheels, and not an sdist installed from anywhere else.
config-settings-package = { minifs = { build-args = "--features oracle" } }
# Rebuild the extension on `uv sync` when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["minifs"]

[tool.ruff.lint.per-file-ignores]
"minifs/tools/*.py" = ["E501"]  # tool prompts are long prose lines

[tool.ruff.format]
quote-style = "double"
# The README's code blocks are illustrative sketches, not formatted source.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["minifs", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
