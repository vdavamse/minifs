name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The release configuration, without `oracle`.
      - run: cargo clippy --all-targets -- -D warnings
      - run: uv run pyright

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features oracle

  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions Databricks Lakebase offers (17 is its default). 18 has a built-in uuidv7(); 16 and 17
        # use the SQL fallback, since Lakebase has no pg_uuidv7.
        postgres: ["16", "17", "18"]
    env:
      MINIFS_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # ripgrep is the reference for the regex-rejection cross-check.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: uv sync --frozen
      - run: uv run pytest -q
