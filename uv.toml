# Settings for working in this checkout. They live here rather than in pyproject.toml's [tool.uv] because the
# sdist ships pyproject.toml, and uv would apply them when installing the sdist anywhere else.

# The development build (uv sync) enables the regex oracle; release wheels and sdist installs don't.
config-settings-package = { minifs = { build-args = "--features oracle" } }

# Rebuild the extension when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]
